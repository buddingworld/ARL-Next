# =============================================================================
# ARL-Next 源码模式 Nginx 网关配置
#
# 基于 frontend/default.conf.prod 改造，差异仅 4 处指向 + 2 处删除：
#   静态根目录  /usr/share/nginx/html  ->  /opt/arl-next/frontend/dist
#   证书目录    /certs/                ->  /opt/arl-next/ssl-certs/
#   后端上游    arl-web:5000           ->  127.0.0.1:5000
#   Basic Auth 凭据路径同步调整
#   删除 /update_stream/ 代理（不部署更新守护服务）
#   删除备份上传/下载直传块（不启用备份功能）
#
# 安装位置：/etc/nginx/conf.d/arl.conf
# =============================================================================

server {
    listen       5173 ssl http2;
    # 注意：`listen ... http2` 是兼容写法，在 nginx 1.22（Debian 12 自带）上可用，
    # 在 1.25.1+ 上仅产生弃用告警。若想消除告警，改成下面两行即可：
    #   listen 5173 ssl;
    #   http2  on;
    server_name  _;

    # Basic Auth 前置网关（默认关闭）
    # 源码模式不部署 updater 守护进程，顶部导航栏的开关会显示「控制服务未连接」，
    # 因此这里改为静态配置：如需开启，把 off 改为 "Restricted Access - AntiScan"
    # 并确保凭据文件存在（生成命令见 deploy/source/README.md）。
    auth_basic off;
    auth_basic_user_file /opt/arl-next/frontend/.htpasswd;

    ssl_certificate      /opt/arl-next/ssl-certs/arl.crt;
    ssl_certificate_key  /opt/arl-next/ssl-certs/arl.key;

    # TLS 协议与长效会话复用加速 (避免每次请求重复握手)
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  on;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # TCP 高性能传输优化
    tcp_nopush   on;
    tcp_nodelay  on;

    # 开启 gzip 压缩加速静态资源加载
    gzip on;
    gzip_static on; # 优先使用前端预生成的 .gz 文件，降低 CPU 消耗
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 application/vnd.ms-fontobject;
    gzip_vary on;
    # 必须开启 gzip_proxied 才能压缩代理转发的 API 响应内容
    gzip_proxied any;

    # 1. 静态文件代理
    location / {
        root   /opt/arl-next/frontend/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # MCP 客户端脚本直链下载与静态分发 (不受 Basic Auth 拦截)
    location ^~ /mcp/ {
        auth_basic off;
        root   /opt/arl-next/frontend/dist;
    }

    # 针对静态资源添加长期不可变缓存 (带 Hash 的 Chunk)
    location ^~ /assets/ {
        root   /opt/arl-next/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 针对 favicon 和通用图标等静态文件添加缓存
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        root   /opt/arl-next/frontend/dist;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # 针对 index.html 禁用缓存，确保每次加载最新的前端资源
    location = /index.html {
        root   /opt/arl-next/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 2. 动态 API 反向代理 (使用 ^~ 阻止正则匹配劫持以 .jpg/.png 结尾的截图 API)
    location ^~ /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 允许最大 200MB 请求体，放宽超大字典、PoC 脚本包等文件上传与文本提交
        client_max_body_size 200m;
        client_body_timeout 300s;
        send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 优化大文件(如截图)传输缓冲，防止写入临时文件增加磁盘 IO 消耗
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 3. 更新与 Basic Auth 控制接口：源码模式不部署 updater 守护进程。
    #    显式返回 404，让前端「一键更新」面板与顶部 Basic Auth 开关走优雅降级分支
    #    （开关显示「控制服务未连接」并置灰），而不是被 location / 兜底返回 index.html。
    location ^~ /update_stream/ {
        return 404;
    }
}
